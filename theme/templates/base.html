{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Speed Dating{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cny-bg: #f8eee5;
            --cny-bg-2: #eed0a1;
            --cny-gold-1: #e39a63;
            --cny-gold-2: #e28f28;
            --cny-gold-3: #c18433;
            --cny-red-1: #b4412e;
            --cny-red-2: #b52128;
            --cny-dark: #3b2a1e;
            --cny-muted: #7a5a45;
            --cny-accent: #be8537;
        }
        html {
            background: var(--cny-bg);
            height: 100%;
        }
        
        body.cny-body {
            background: var(--cny-bg);
            min-height: 100%;
            overscroll-behavior-y: none;
        }
        .cny-card {
            background: color-mix(in srgb, white 86%, var(--cny-bg));
            border: 1px solid color-mix(in srgb, var(--cny-bg-2) 65%, white);
            box-shadow: 0 10px 30px rgba(180, 65, 46, 0.08);
        }
        .cny-chip {
            background: color-mix(in srgb, var(--cny-red-1) 12%, white);
            border: 1px solid color-mix(in srgb, var(--cny-red-1) 35%, white);
            color: var(--cny-red-1);
        }
        .cny-text-muted { color: var(--cny-muted); }
        .cny-text-accent { color: var(--cny-red-1); }
        .cny-text-gold { color: var(--cny-gold-3); }
        .cny-btn {
            background: var(--cny-red-1);
            color: #fff;
            box-shadow: 0 8px 18px rgba(180, 65, 46, 0.18);
        }
        .cny-btn:hover { background: var(--cny-red-2); }
        .cny-btn-gold {
            background: var(--cny-gold-2);
            color: #2a1a10;
        }
        .cny-body {
            font-family: "Source Sans 3", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        .cny-title {
            font-family: "Cinzel", ui-serif, "Times New Roman", serif;
            letter-spacing: 0.02em;
        }
    </style>
</head>

<body class="cny-body antialiased">
    <div class="min-h-screen flex flex-col">
        <main class="flex-1">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
